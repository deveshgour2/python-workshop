<html>

<head>

    <script>
        function f1() {
            document.getElementById("b1").style.backgroundColor = "red"
        }
        function f2() {
            document.getElementById("b1").style.backgroundColor = "blue"
        }

        function f3() {
            document.getElementById("b1").style.backgroundColor = "green"
        }

    </script>
</head>

<body id="b1">
    <input type="button" value=" red" onclick="f1()">
    <input type="button" value=" blue" onclick="f2()">
    <input type="button" value="green" onclick="f3()">
</body>

</html>
