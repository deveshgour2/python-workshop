<html>

<body>
    <form action="success.html" method="post">
    <table border="1" align="center" bgcolor="lightblue">
        <th colspan="2">Registration form</th>
        <tr align="center">
            <td>First name</td>
            <td><input type="text"></td>
        </tr>
        <tr align="center">
            <td>Last name</td>
            <td><input type="text"></td>
        </tr>
        <tr align="center">
            <td>Email</td>
            <td><input type="email"></td>
        </tr>
        <tr align="center">
            <td>Password</td>
            <td><input type="password" minlength="8" maxlength="20"></td>
        </tr>
        <tr align="center">
            <td>mobile number</td>
            <td><input type="text"></td>
        </tr>
        <tr align="center">
            <td>Date of birth</td>
            <td><input type="date"></td>
        </tr>
        <tr align="center">
            <td>Gender</td>
            <td>
                <input type="radio" name="gender" value="male"> Male
                <input type="radio" name="gender" value="female"> Female
            </td>
        <tr align="center">
            <td>address</td>
            <td><textarea rows="4" cols="20"></textarea></td>
        </tr>
        <tr align="center">
            <td>City</td>
            <td>
                <select>
                    <option value="0">select city</option>
                    <option value="1">Indore</option>
                    <option value="2">Bhopal</option>
                    <option value="3">Ujjain</option>
                    <option value="4">Dewas</option>
                </select>
            </td>
        </tr>
        <tr align="center">
            <td>Hobbies</td>
            <td>
                <input type="checkbox" name="hobbies" value="cricket"> Cricket
                <input type="checkbox" name="hobbies" value="football"> Football
                <input type="checkbox" name="hobbies" value="reading"> Reading
                <input type="checkbox" name="hobbies" value="singing"> Singing
        </tr>
        <tr align="center">
            <td>Profile pic</td>
            <td><input type="file"></td>
        </tr>
        <tr>

            <td colspan="2" align="center">
                <input type="submit" value="create profile">
                <input type="reset" value="clear all">
            </td>
        </tr>
    </table>
    </form>
</body>

</html>
